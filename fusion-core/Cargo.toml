[package]
name = "fusion-core"
version = "0.1.0"
edition = "2021"
rust-version = "1.94"
description = "Deterministic, memory-safe EVM execution engine with economic guardrails for edge AI intents"
license = "MIT"

[lib]
name = "fusion_core"
crate-type = ["lib", "cdylib"]

[[bin]]
name = "uniffi-bindgen"
path = "src/bin/uniffi-bindgen.rs"

[dependencies]
alloy = { version = "2.5", default-features = false, features = [
    "std",
    "json",
    "sol-types",
    "serde",
    "providers",
    "provider-http",
    "reqwest-rustls-tls",
    "signer-local",
    "rpc-types-eth",
] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread"] }
uniffi = { version = "0.32.2", features = ["cli", "tokio"] }
url = "2"
zeroize = "1"

[dev-dependencies]
tempfile = "3"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time"] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = "debuginfo"